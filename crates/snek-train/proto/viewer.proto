syntax = "proto3";
package snek;

// Contract for the run-viewer API. The Rust trainer serves these as binary
// protobuf (application/x-protobuf); the frontend decodes them with the
// buf-generated protobuf-es classes. Kept separate from snek.proto (the live
// training stats/control messages) so the two concerns stay decoupled.

// One row on the home page: enough to render a run card without loading detail.
message RunSummary {
  string run_id = 1;
  bool live = 2;                // this run is the trainer's active run
  bool running = 3;            // trainer is actively stepping it
  uint32 generation = 4;       // latest generation reached
  uint32 total_generations = 5;
  uint32 board = 6;
  uint32 num_snakes = 7;
  double policy_loss = 8;       // latest metrics.jsonl row
  double value_loss = 9;
  double win_rate = 10;
  bool has_win_rate = 11;       // false when the run never evaluated
  uint32 game_gen_count = 12;   // number of generations with recorded games
  int64 updated_unix_ms = 13;   // last-modified time, for sorting/display
}

message RunListReply {
  repeated RunSummary runs = 1; // newest first
}

// A single metrics.jsonl row (one per generation), projected to the fields the
// charts use. All per-gen counts are for that generation only, not cumulative.
message MetricRow {
  uint32 generation = 1;
  double policy_loss = 2;
  double value_loss = 3;
  double win_rate = 4;
  bool has_win_rate = 5;
  uint32 completed_games = 6;   // games finished during this generation
  double target_entropy = 7;
  uint32 samples = 8;           // training samples collected this generation
  uint32 turns = 9;             // self-play turns this generation
  uint64 buffer = 10;           // replay buffer size after this generation
  double gen_seconds = 11;      // wall time for the whole generation
  double play_seconds = 12;     // self-play portion
  double train_seconds = 13;    // training portion
  double inferences_per_sec = 14;
  double games_per_sec = 15;
  double gpu_busy_pct = 16;
  double avg_game_turn = 17;    // mean game turn across all buffered samples
  double lr = 18;               // learning rate trained at (0 for old runs)
  // LE held-out strength eval (the Elo replacement), only on eval gens.
  double le_ff_winrate = 19;    // candidate vs floodfill-greedy (sanity line)
  double le_vor_winrate = 20;   // candidate vs voronoi@gate_sims (the gate match)
  bool has_le_eval = 21;        // true only on generations that ran a gate
  double net_entropy = 22;      // entropy (nats) of the net's own policy output
  double le_vor_incumbent = 23; // incumbent's same-seed rate in the same gate
  double le_vor_probe = 24;     // incumbent vs voronoi@probe_sims (goal line)
  bool has_probe = 25;          // true when le_vor_probe was measured this gen
  bool gate_promoted = 26;      // candidate promoted to incumbent this gate
  double le_h2h_share = 27;     // candidate's share of decisive head-to-head gate games (0.5 = parity)
  bool has_h2h = 28;            // true when this gen ran a head-to-head gate
}

// A generation that has recorded self-play sample games on disk.
message GameGen {
  uint32 gen = 1;
  uint32 num_games = 2;
}

// One seat's finish in a league game. Rank 1 is best; ties share a rank.
message MatchPlacement {
  uint32 gen = 1;         // which net held the seat
  uint32 seat = 2;
  uint32 rank = 3;
  uint32 death_turn = 4;  // 0 when the snake survived
  bool survived = 5;
}

// One completed league game: the full elimination ranking of its players
// (from runs/<id>/eval/summary.jsonl).
message LeagueMatch {
  uint64 seq = 1;                        // monotonic game number within the run
  repeated MatchPlacement placements = 2; // seat order
  uint32 turns = 3;
  uint32 sims = 4;
  double wall_seconds = 5;
  int64 finished_unix_ms = 6;
}

// One net's fitted league rating: Plackett–Luce maximum likelihood over every
// recorded game (multiplayer generalization of Bradley–Terry), anchored so
// the earliest rated generation is Elo 0.
message LeagueRating {
  uint32 gen = 1;
  double elo = 2;
  uint32 games = 3;
  uint32 wins = 4;      // rank-1 finishes (== placements[0])
  double avg_rank = 5;
  // Display name ("gen_0042", "floodfill", or a configured API player's
  // name). Empty for ratings written before names existed.
  string name = 6;
  // Finishes by rank: placements[r-1] = number of r-th-place finishes. Length
  // is the deepest rank this net ever reached. Empty in older ratings files.
  repeated uint32 placements = 7;
}

message RunDetail {
  RunSummary summary = 1;
  string config_json = 2;          // raw config.json, shown in the knobs panel
  repeated MetricRow metrics = 3;  // full history, oldest first
  repeated GameGen game_gens = 4;  // newest first
  repeated LeagueRating league = 6;   // latest fit, ascending by generation
  repeated LeagueMatch matches = 7;   // league games, oldest first
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

// One snake's state and search readout at a single turn.
message SnakeFrame {
  bool alive = 1;
  repeated Point body = 2;         // head first
  int32 health = 3;
  uint32 chosen_move = 4;          // 0=Up 1=Down 2=Left 3=Right
  repeated double policy = 5;      // search visit policy over the 4 moves
  repeated double play_policy = 6; // masked policy actually sampled from
  double value = 7;                // value head at the root
}

message Frame {
  uint32 turn = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated Point food = 4;
  repeated Point hazards = 5;
  repeated SnakeFrame snakes = 6;
}

message Game {
  repeated Frame frames = 1;
  int32 winner = 2;   // winning snake index, -1 for a draw
  uint32 num_turns = 3;
  // Bitmask of seats controlled by a built-in heuristic sparring partner this
  // game (bit i set => snake index i is the heuristic, not the learning net).
  // 0 for ordinary net-vs-net self-play. Lets the replay viewer mark which
  // snake is voronoi.
  uint32 heur_mask = 4;
  // Curriculum scenario this game was seeded from (snek_core::scenario name),
  // empty for a standard start. Lets the viewer badge seeded games.
  string scenario = 5;
}

message GameFile {
  uint32 gen = 1;
  repeated Game games = 2;
  string config_json = 3;   // training config in effect for this generation
}
