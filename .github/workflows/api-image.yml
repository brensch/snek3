name: api-image

# Builds the CPU-only Battlesnake /move API image: the tch/libtorch snek-server
# with the tracked serving checkpoint (checkpoints/serving.safetensors) baked
# in. Everything — viewer build, libtorch install, cargo build — happens inside
# deploy/server.Dockerfile.
#
# Runs when a version tag (v*) is pushed; the image is tagged with the git tag
# and `latest`. `workflow_dispatch` builds from any ref and updates `latest`.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/snek3-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push CPU API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          # zstd layers pull smaller and decompress much faster than gzip.
          # Pulling requires a containerd-backed docker on the host; if the
          # deploy box ever fails to pull, drop this back to `push: true`.
          # No force-compression: unchanged layers (notably the ~2GB libtorch
          # one) reuse their existing compressed blobs instead of being
          # re-squeezed at level 19 every build.
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19
          tags: ${{ steps.meta.outputs.tags }}
          # Registry cache instead of type=gha: the Actions cache is capped at
          # 10GB/repo, which the trainer+api layer sets blow past, so every
          # build re-uploaded gigabytes after eviction. GHCR dedups by digest,
          # so unchanged layers cost nothing to "upload".
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/snek3-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/snek3-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
